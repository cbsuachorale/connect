<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}

.ic img,.ic svg{width:100%;height:100%;object-fit:contain}
.ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.icon-edit .ic{outline:2px dashed var(--y);outline-offset:3px;cursor:pointer;border-radius:4px}
body.icon-edit .ic::after{content:"✎";position:absolute;right:-8px;top:-10px;background:var(--y);color:#000;border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;text-align:center}
.banner{background:var(--y);color:#2b2200;text-align:center;padding:6px 12px;font-size:.88rem;font-weight:600}
/* layout */
.shell{max-width:1040px;margin:0 auto;display:flex;gap:20px;padding:20px 16px 90px}
nav.side{width:200px;flex:none;position:sticky;top:76px;align-self:flex-start}
nav.side a,nav.side button.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;background:none;border:0;cursor:pointer;text-align:left}
nav.side a:hover,nav.side button.navbtn:hover{background:var(--gl)}
nav.side a.on{background:var(--g);color:#fff}
main#view{flex:1;min-width:0}
@media(max-width:760px){
 .shell{display:block;padding:12px 12px 90px}
 nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:30;background:#fff;border-top:3px solid var(--y);display:flex;justify-content:flex-start;overflow-x:auto;padding:4px}
 nav.side a,nav.side button.navbtn{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 2px;justify-content:center;text-align:center;flex:1 0 62px;min-width:62px}
 .userchip b{display:none}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--g);color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.y{background:var(--y);color:#241c00}
.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.d{background:var(--red)}
.btn.s{padding:6px 14px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:wait}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
label small{font-weight:400;color:var(--mut)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid #f5c51855;border-color:var(--g3)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:560px){.row,.row3{grid-template-columns:1fr}}

.hint{color:var(--mut);font-size:.82rem;margin-top:3px}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::before{content:"▸ ";color:var(--g3)}

.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* feed */
.av{width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--y);display:inline-flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none;border:2px solid var(--y)}
.av img{width:100%;height:100%;object-fit:cover}
.av.xl{width:96px;height:96px;font-size:2rem}
.post{padding:0}
.post header{display:flex;align-items:center;gap:10px;padding:12px 14px}

.post .media{background:#0b1a10;display:flex;justify-content:center}
.post .media img,.post .media video{max-width:100%;max-height:640px;display:block}
.post .body{padding:10px 14px 14px}
.acts{display:flex;gap:16px;font-size:1.25rem;margin-bottom:6px}

.tag{color:var(--g3);font-weight:700;text-decoration:none}
.cm{font-size:.9rem;margin:3px 0;display:flex;gap:6px;align-items:baseline}
.cm .x{margin-left:auto;background:none;border:0;color:var(--red);cursor:pointer}
.cmform{display:flex;gap:8px;margin-top:8px}
.cmform input{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--gl);border:1px solid var(--line);color:var(--g);padding:4px 12px;border-radius:999px;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none}
.chip.on{background:var(--y);color:#241c00;border-color:var(--y2)}
.preview{margin:8px 0}
.preview img,.preview video{max-width:100%;max-height:260px;border-radius:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.ann{border-left:6px solid var(--y);display:flex;gap:14px}
.ann .type{display:inline-block;background:var(--g);color:#fff;padding:2px 12px;border-radius:999px;font-size:.78rem;font-weight:700}
.ann .when{color:var(--g);font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--gl);color:var(--g)}
.pill.p{background:#fff3c4;color:#6b5200}.pill.dn{background:#fde4e2;color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.person small{display:block;color:var(--mut)}
.pgrp{display:flex;align-items:center;gap:8px;margin:18px 0 8px;color:var(--g)}
.pgrp h3{margin:0}
/* modal & toast */
.mback{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:22px;border-top:6px solid var(--y);position:relative}
.modal .close{position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.6rem;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 18px;border-radius:999px;z-index:200;font-weight:600;max-width:90vw;display:none;border:2px solid var(--y)}
footer.foot{text-align:center;color:var(--mut);font-size:.82rem;padding:10px 0 0}
.lock{text-align:center;padding:40px 16px}
</style>
</head>

<script>
/* =====================================================================
   CHORALE CONNECT  |  CBSUA Chorale
   ---------------------------------------------------------------------
   SYNC SETUP: paste your Firebase web-app config below to make every
   device share the same members, posts, announcements and music sheets
   (see SETUP.md). Leave it as null to run in single-browser demo mode.
   ===================================================================== */
const FIREBASE_CONFIG = null;
/* e.g.
const FIREBASE_CONFIG = {
  apiKey:"...", authDomain:"...", projectId:"...", storageBucket:"...",
  messagingSenderId:"...", appId:"..."
};
*/

const ADMIN_EMAIL = 'cbsuachorale.calabanga@cbsua.edu.ph';
const ADMIN_HASH  = '96525de05d4ac7278a40643e9171079519df4dd67ac5c2e9956600882957f6b5';
const LINKS = {
  email: 'cbsuachorale.calabanga@cbsua.edu.ph',
  fb: 'https://www.facebook.com/cbsuachorale',
  fbText: 'www.facebook.com/cbsuachorale',
  web: 'https://www.cbsuacalabangachorale.com',
  webText: 'www.cbsuacalabangachorale.com',
  line: 'https://line.me/R/ti/g/9axJ5qEFTs',
  lineText: 'line.me/R/ti/g/9axJ5qEFTs',
  band: 'https://band.us/page/100307152',
  bandText: 'band.us/page/100307152'
};
const COLLEGES = ['CAS','CHM','CIT','COE','IFAS','LabHigh'];
const REG_CATS = ['Alumni','Adviser','CAS','CHM','CIT','COE','IFAS','LabHigh','Faculty'];
const CAT_LABEL = {Alumni:'Alumni',Adviser:'Adviser',CAS:'CAS - College of Arts and Sciences',CHM:'CHM - College of Hospitality and Management',CIT:'CIT - College of Industrial Technology',COE:'COE - College of Education',IFAS:'IFAS - Institute of Fisheries and Allied Sciences',LabHigh:'LabHigh - Laboratory High School',Faculty:'Faculty'};
const GROUP_LABEL = {Alumni:'Alumni',Adviser:'Advisers',Faculty:'Faculty',CAS:'College of Arts and Sciences (CAS)',CHM:'College of Hospitality and Management (CHM)',CIT:'College of Industrial Technology (CIT)',COE:'College of Education (COE)',IFAS:'Institute of Fisheries and Allied Sciences (IFAS)',LabHigh:'Laboratory High School (LabHigh)'};
const isStaff = c=>c==='Faculty'||c==='Adviser';
const staffIdOk = s=>/^EO3-\d{2}-\d{4}$/.test(s);
const ANN_TYPES = ['Rehearsal','Performance','Meeting','Audition','Event','Reminder','Other'];

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const idOk = s=>/^\d{2}-\d{4}$/.test(s);
const cbsuaOk = s=>/^[a-z0-9._'-]+@cbsua\.edu\.ph$/i.test(s);
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(ts).toLocaleDateString()}
function sha256js(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mw=Math.pow(2,32);let i,j,result='';
  const words=[],bl=ascii.length*8;let hash=[],k=[];const comp={};
  for(let c=2,pc=0;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*mw)|0;k[pc++]=(Math.pow(c,1/3)*mw)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bl/mw)|0);words[words.length]=bl;
  for(j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
  return result}
const hashPw=(email,pw)=>sha256js(unescape(encodeURIComponent('cc|'+email.toLowerCase()+'|'+pw)));

/* ---------- safe local storage ---------- */
const mem={};
const LS={get(k){try{const v=localStorage.getItem(k);return v}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){if(e&&e.name&&/quota/i.test(e.name))throw e;mem[k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};

/* ---------- data store (Firebase Firestore or local fallback) ---------- */
const COLS=['users','posts','announcements','sheets','auditions','settings'];
const Store={
  mode:'local',fdb:null,fv:null,cache:{},subs:[],ready:false,note:'',
  async init(){
    COLS.forEach(c=>this.cache[c]={});
    if(FIREBASE_CONFIG){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
        firebase.initializeApp(FIREBASE_CONFIG);
        this.fdb=firebase.firestore();this.fv=firebase.firestore.FieldValue;this.mode='firebase';
        let got=0;
        await new Promise(res=>{
          const to=setTimeout(res,6000);
          COLS.forEach(c=>{let first=true;
            this.fdb.collection(c).onSnapshot(snap=>{
              const o={};snap.forEach(d=>o[d.id]=d.data());this.cache[c]=o;
              if(first){first=false;if(++got===COLS.length){clearTimeout(to);res()}}
              this.emit()},err=>{this.note='Cloud sync error: '+err.message;if(first){first=false;if(++got===COLS.length){clearTimeout(to);res()}}this.emit()})});
        });
        this.ready=true;return;
      }catch(e){this.note='Could not start cloud sync ('+e.message+'). Running in local mode.';this.mode='local'}
    }
    COLS.forEach(c=>this.loadLocal(c));
    try{const bc=new BroadcastChannel('cc_sync');bc.onmessage=()=>{COLS.forEach(c=>this.loadLocal(c));this.emit()};this.bc=bc}catch(e){}
    window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith('cc_')){COLS.forEach(c=>this.loadLocal(c));this.emit()}});
    this.ready=true;
  },
  loadLocal(c){try{this.cache[c]=JSON.parse(LS.get('cc_'+c)||'{}')}catch(e){this.cache[c]={}}},
  saveLocal(c){LS.set('cc_'+c,JSON.stringify(this.cache[c]));try{this.bc&&this.bc.postMessage(1)}catch(e){}},
  on(fn){this.subs.push(fn)},emit(){this.subs.forEach(f=>{try{f()}catch(e){console.error(e)}})},
  list(c){return Object.entries(this.cache[c]||{}).map(([id,v])=>({id,...v}))},
  get(c,id){const v=(this.cache[c]||{})[id];return v?{id,...v}:null},
  async set(c,id,obj){
    const clean=JSON.parse(JSON.stringify(obj));delete clean.id;
    this.cache[c][id]=clean;
    if(this.mode==='firebase'){this.emit();await this.fdb.collection(c).doc(id).set(clean)}
    else{this.saveLocal(c);this.emit()}},
  async merge(c,id,patch){
    this.cache[c][id]={...(this.cache[c][id]||{}),...patch};
    if(this.mode==='firebase'){this.emit();await this.fdb.collection(c).doc(id).set(patch,{merge:true})}
    else{this.saveLocal(c);this.emit()}},
  async del(c,id){
    delete this.cache[c][id];
    if(this.mode==='firebase'){this.emit();await this.fdb.collection(c).doc(id).delete()}
    else{this.saveLocal(c);this.emit()}},
  async arr(c,id,field,add,val){
    const d=this.cache[c][id];if(!d)return;
    const a=(d[field]||[]).slice();
    if(add)a.push(val);else{const i=a.findIndex(x=>JSON.stringify(x)===JSON.stringify(val));if(i>-1)a.splice(i,1)}
    d[field]=a;
    if(this.mode==='firebase'){this.emit();await this.fdb.collection(c).doc(id).update({[field]:add?this.fv.arrayUnion(val):this.fv.arrayRemove(val)})}
    else{this.saveLocal(c);this.emit()}},
  /* big files (photos, videos, music sheets) are stored in chunks */
  get maxFile(){return this.mode==='firebase'?4*1024*1024:1.2*1024*1024},
  async putBlob(dataUrl){
    const id=uid(),CH=700000,n=Math.ceil(dataUrl.length/CH);
    if(this.mode==='firebase'){
      for(let i=0;i<n;i++)await this.fdb.collection('blobs').doc(id+'_'+i).set({bid:id,i,n,d:dataUrl.slice(i*CH,(i+1)*CH)});
    }else LS.set('cc_blob_'+id,dataUrl);
    return id},
  async getBlob(id){
    if(this.mode==='firebase'){
      const s=await this.fdb.collection('blobs').where('bid','==',id).get();
      const parts=[];s.forEach(d=>parts.push(d.data()));parts.sort((a,b)=>a.i-b.i);
      return parts.map(p=>p.d).join('')}
    return LS.get('cc_blob_'+id)||''},
  async delBlob(id){
    if(!id)return;
    if(this.mode==='firebase'){const s=await this.fdb.collection('blobs').where('bid','==',id).get();const b=this.fdb.batch();s.forEach(d=>b.delete(d.ref));await b.commit()}
    else LS.del('cc_blob_'+id)}
};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script blocked'));document.head.appendChild(s)})}

/* ---------- files / images ---------- */
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function resizeImage(file,max,type='image/jpeg',q=.82){
  const url=await readFile(file);
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
    let{width:w,height:h}=im;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}

const PREFIX=['delos','delas','dela','del'];
const SPECIAL={deleon:'De Leon',dejesus:'De Jesus',delima:'De Lima',delarosa:'Dela Rosa'};
const cap=s=>s.replace(/(^|\s)\S/g,m=>m.toUpperCase());
function splitName(local){
  const parts=local.toLowerCase().replace(/[0-9]/g,'').split(/[._-]+/).filter(Boolean);
  if(!parts.length)return{given:'',surname:''};
  if(parts.length===1)return{given:cap(parts[0]),surname:''};
  let sur=parts.pop(),given=cap(parts.join(' '));
  if(SPECIAL[sur])sur=SPECIAL[sur];
  else{for(const p of PREFIX){if(sur.startsWith(p)&&sur.length-p.length>=4){sur=p+' '+sur.slice(p.length);break}}}
  return{given,surname:cap(sur)}}

function auditionForm(){
  const m=modal(`<h2>Audition Form</h2><p class="hint">Tell us about yourself. The Chorale will reach out about your audition.</p>

    <div class="row3"><div><label>Given Name</label><input type="text" id="a_g" required autocomplete="given-name"></div>

    catch(er){err('Could not submit: '+er.message)}}}

function idMaskFor(inp,getCat){
  inp.addEventListener('input',()=>{
    const staff=isStaff(getCat());
    const d=inp.value.replace(/^\s*E[O0]3-?/i,'').replace(/\D/g,'').slice(0,6);
    const body=d.length>2?d.slice(0,2)+'-'+d.slice(2):d;
    inp.value=d?(staff?'EO3-':'')+body:''})}
function givenFromEmail(loc){
  const parts=loc.toLowerCase().replace(/[0-9]/g,'').split(/[._-]+/).filter(Boolean);
  if(parts.length>=3&&['de','del','dela','delos','delas','dela'].includes(parts[parts.length-2])){
    const sur=cap(parts.pop()),pre=cap(parts.pop());return{given:cap(parts.join(' ')),surname:pre+' '+sur}}
  return splitName(loc)}

function signupForm(){
  const m=modal(`<h2>Sign up</h2><p class="hint">For CBSUA Chorale members and alumni. Sign up once and you are in. Next time, just log in.</p>
  <form id="sf2" novalidate>
    <label>CBSUA Email</label><input type="email" id="r_e" required autocomplete="email">

    <div><label>Middle Name <small>(if any)</small></label><input type="text" id="r_m" autocomplete="additional-name"></div>
    <div><label>Surname</label><input type="text" id="r_s" required autocomplete="family-name"></div></div>
    <label>I am…</label><select id="r_c" required><option value="">Select…</option>${REG_CATS.map(c=>`<option value="${c}">${esc(CAT_LABEL[c])}</option>`).join('')}</select>
    <label>ID Number</label><input type="text" id="r_i" inputmode="numeric" autocomplete="off" maxlength="11">

    <div><label>Confirm Password</label><input type="password" id="r_p2" autocomplete="new-password"></div></div>
    <div class="err" id="r_err"></div>
    <button class="btn y" style="width:100%;margin-top:8px">Sign up</button></form>
    <p class="hint" style="text-align:center;margin-top:12px">Already signed up? <a href="#" id="r_li">Log in</a></p>`);
  $('#r_li',m).onclick=e=>{e.preventDefault();m.close();loginForm()};
  const g=$('#r_g',m),sn=$('#r_s',m),ii=$('#r_i',m);let dirty=false;
  g.addEventListener('input',()=>dirty=true);sn.addEventListener('input',()=>dirty=true);
  $('#r_e',m).addEventListener('input',e=>{if(dirty)return;const v=e.target.value.trim();const at=v.indexOf('@');const loc=at>-1?v.slice(0,at):v;const n=givenFromEmail(loc);g.value=n.given;sn.value=n.surname});
  idMaskFor(ii,()=>$('#r_c',m).value);
  $('#r_c',m).onchange=()=>{ii.value=ii.value.replace(/^\s*E[O0]3-?/i,'');ii.dispatchEvent(new Event('input'))};
  $('#sf2',m).onsubmit=async e=>{e.preventDefault();
    const v=id=>$('#'+id,m).value.trim(),err=t=>($('#r_err',m).textContent=t,false);
    const email=v('r_e').toLowerCase(),cat=v('r_c'),staff=isStaff(cat),idno=v('r_i');
    if(!cbsuaOk(email))return err('Please use your CBSUA email address.');
    if(email===ADMIN_EMAIL)return err('This email is reserved.');
    if(!v('r_g')||!v('r_s'))return err('Please enter your given name and surname.');
    if(!cat)return err('Please choose who you are in the Chorale.');
    if(staff?!staffIdOk(idno):!idOk(idno))return err('Please enter a valid ID number.');
    const pw=$('#r_p',m).value;
    if(pw.length<6)return err('Password must be at least 6 characters.');
    if(pw!==$('#r_p2',m).value)return err('Passwords do not match.');
    const ex=Store.get('users',email);
    if(ex&&ex.status==='approved')return err('This email already has an account. Please log in.');
    try{const h=hashPw(email,pw);
      await Store.set('users',email,{email,given:v('r_g'),middle:v('r_m'),surname:v('r_s'),idno,category:cat,hash:h,status:'approved',nickname:v('r_g'),avatar:'',created:Date.now()});

function loginForm(){
  const m=modal(`<h2>Log in</h2><form id="lf" novalidate>
    <label>CBSUA Email</label><input type="email" id="l_e" required autocomplete="username">
    <label>Password</label><input type="password" id="l_p" required autocomplete="current-password">
    <div class="err" id="l_err"></div><button class="btn y" style="width:100%;margin-top:8px">Log in</button></form>

function renderChrome(){

  $('#banner').innerHTML=Store.mode==='local'&&isAdmin()?'<div class="banner">Local demo mode: data is saved only on this device. Add your Firebase config to sync across devices (see SETUP.md).</div>':'';
  paintIcons();updateFavicon();document.body.classList.toggle('icon-edit',iconEdit&&isAdmin())}
let iconEdit=false,iconSlot=null;

Store.on(()=>{
  /* drop sessions that are no longer valid (e.g. removed by admin) */
  if(sess&&!me()&&Store.ready){setSession(null);toast('You have been logged out.');route();return}
  const a=document.activeElement;const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#view')&&!a.closest('.cmform')?true:false;
  renderChrome();
  if(refresh&&!(typing&&(location.hash==='#admin'))){const keep=a&&a.closest('.cmform')?{id:a.closest('.cmform').dataset.id,v:a.value}:null;refresh();if(keep){const f=$(`.cmform[data-id="${keep.id}"] input`);if(f){f.value=keep.v;f.focus()}}}
});

document.addEventListener('click',async e=>{
  /* icon edit mode: any icon becomes an upload button for the admin */
  const icon=e.target.closest('.ic[data-icon]');
  if(icon&&iconEdit&&isAdmin()){e.preventDefault();e.stopPropagation();iconSlot=icon.dataset.icon;$('#iconpick').click();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  if(t.tagName==='A'&&t.getAttribute('href')==='#connect'&&act!=='tag'&&act!=='cleartag')return;
  if(act!=='tag'&&act!=='cleartag'||t.tagName!=='A')e.preventDefault();
  switch(act){
    case'audition':auditionForm();break;
    case'login':loginForm();break;
    case'signup':signupForm();break;
    case'logout':setSession(null);toast('Logged out.');location.hash='#home';route();break;
    case'tag':e.preventDefault();tagFilter=t.dataset.tag;if((location.hash||'#home')!=='#connect')location.hash='#connect';else route();break;
    case'cleartag':e.preventDefault();tagFilter='';route();break;
    case'like':{const p=Store.get('posts',id),m=me();if(!p||!m)break;const has=(p.likes||[]).includes(m.email);await Store.arr('posts',id,'likes',!has,m.email);break}
    case'delpost':if(isAdmin()&&await sure('Delete this post?')){const p=Store.get('posts',id);await Store.del('posts',id);if(p&&p.media)Store.delBlob(p.media.id)}break;
    case'delcomment':{const p=Store.get('posts',id);const c=p&&(p.comments||[]).find(x=>x.id===t.dataset.cid);if(c&&isAdmin())await Store.arr('posts',id,'comments',false,c);break}
    case'delann':if(isAdmin()&&await sure('Delete this announcement?'))await Store.del('announcements',id);break;
    case'delsheet':if(isAdmin()&&await sure('Delete this music sheet?')){const s=Store.get('sheets',id);await Store.del('sheets',id);if(s)Store.delBlob(s.blob)}break;
    case'delaud':if(isAdmin()&&await sure('Delete this application?'))await Store.del('auditions',id);break;
    case'approve':if(isAdmin()){await Store.merge('users',id,{status:'approved'});toast('Member approved.')}break;
    case'deny':if(isAdmin()){await Store.merge('users',id,{status:'denied'});toast('Request denied.')}break;
    case'deluser':if(isAdmin()&&await sure('Remove this member? They will be logged out and must register again.'))await Store.del('users',id);break;
    case'toggle-icons':iconEdit=!iconEdit;renderChrome();toast(iconEdit?'Icon edit mode ON: click any icon to replace it.':'Icon edit mode OFF.');break;
    case'editpage':if(isAdmin()){const key=id,d=Store.get('settings','page_'+key);
      const mm=modal(`<h2>Edit ${key==='history'?'History':'Overview'}</h2><form id="epf"><textarea id="ept" style="min-height:260px">${esc((d&&d.text)||PAGE_DEFAULTS[key])}</textarea><button class="btn y" style="width:100%;margin-top:10px">Save</button></form>`);
      $('#epf',mm).onsubmit=async ev=>{ev.preventDefault();await Store.set('settings','page_'+key,{text:$('#ept',mm).value,ts:Date.now()});mm.close();toast('Page saved.')}}break;
    case'icon-reset':if(isAdmin()){await Store.del('settings','icon_'+t.dataset.slot);toast('Icon reset.')}break;
  }
},true);

/* admin icon buttons inside Logo & icons panel */
document.addEventListener('click',e=>{
  const c=e.target.closest('#icons .ic');
  if(c&&!iconEdit&&isAdmin()){iconSlot=c.dataset.icon;$('#iconpick').click()}
});
$('#iconpick').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!iconSlot||!isAdmin())return;
  try{const d=await resizeImage(f,iconSlot==='logo'?256:128,'image/png');
    await Store.set('settings','icon_'+iconSlot,{data:d,ts:Date.now()});toast('Icon updated.');
    const b=$('#icons');if(b)delete b.dataset.built;}catch(err){toast('Could not use that image.')}};

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form="comment"]');if(!f)return;e.preventDefault();
  const inp=$('input',f),t=inp.value.trim(),m=me();if(!t||!m)return;
  inp.value='';await Store.arr('posts',f.dataset.id,'comments',true,{id:uid(),by:m.email,text:t,ts:Date.now()})});
window.addEventListener('hashchange',route);

/* ---------- start ---------- */
(async function start(){
  view.innerHTML='<div class="card empty">Loading Chorale Connect…</div>';
  await Store.init();
  if(sess&&!me())setSession(null);
  route();
})();
